name: Continuous Integration

on:
  pull_request: ~
  push:
    branches:
    - main
    - dev

# This file is somewhat long, because (a) there are a few different places in Forge that need 
# checking in different ways; and (b) we want to check for Linux, MacOS, and Windows. 

jobs:
  # Ensure that all Forge tests are included in the CI run. 
  check-test-files-included:
    runs-on: ubuntu-latest
    name: check-test-coverage
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Verify all test subdirs are in CI matrix
      run: |
        # Extract all tests/* paths mentioned in the workflow file itself.
        # This avoids maintaining a separate list — the matrix IS the source of truth.
        workflow=".github/workflows/continuousIntegration.yml"
        covered=$(grep -oE 'tests/[a-zA-Z0-9_-]+(/[a-zA-Z0-9_-]+)?' "$workflow" \
                  | sort -u)

        # Check tests/forge/ subdirectories
        actual=$(cd forge && find tests/forge -mindepth 1 -maxdepth 1 -type d | sort)
        missing=$(comm -23 <(echo "$actual") <(echo "$covered"))
        if [ -n "$missing" ]; then
          echo "ERROR: tests/forge/ subdirectories not covered by CI:"
          echo "$missing"
          echo ""
          echo "Add them to a test-dir entry in $workflow"
          exit 1
        fi

        # Check top-level test directories too
        actual_top=$(cd forge && find tests -mindepth 1 -maxdepth 1 -type d | sort)
        missing_top=$(comm -23 <(echo "$actual_top") <(echo "$covered"))
        if [ -n "$missing_top" ]; then
          echo "ERROR: top-level test directories not covered by CI:"
          echo "$missing_top"
          echo ""
          echo "Add them to a test-dir entry in $workflow"
          exit 1
        fi

        echo "All test directories are covered by CI."

  # Check forge/info.rkt's declared dependencies. If there is an undeclared dependency, 
  # the build fails. Also, report declared but unused dependencies for informational purposes.
  check-pkg-deps:
    runs-on: ubuntu-latest
    name: check-pkg-deps
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Racket
      uses: Bogdanp/setup-racket@v1.14
      with:
        version: '9.3'
        distribution: 'minimal'

    - name: Install Forge
      run: raco pkg install --auto --no-docs ./forge

    - name: Check declared package dependencies
      run: raco setup --check-pkg-deps --no-docs --pkgs forge

    - name: Report unused package dependencies (advisory)
      continue-on-error: true
      run: raco setup --check-pkg-deps --unused-pkg-deps --no-docs --pkgs forge

  # Run Forge's main test suite in default (Linux) environment.
  # Includes custom-solver tests for Linux.
  test-forge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: forge-1
            test-dir: tests/forge/other
          - name: forge-2
            test-dir: tests/forge/bounds tests/forge/domains tests/forge/eval-model tests/forge/examples tests/forge/expressions tests/forge/formulas tests/forge/ints tests/forge/library tests/forge/relations tests/forge/sigs tests/forge/target
          - name: forge-core
            test-dir: tests/forge-core tests/forge-functional
          - name: smt
            test-dir: tests/smt
          - name: other
            test-dir: tests/error tests/froglet tests/srclocs tests/temporal
          - name: custom-solver
            test-dir: tests/forge/custom-solver
            custom-run: true

    name: test-${{ matrix.name }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Racket
      uses: Bogdanp/setup-racket@v1.14
      with:
        version: '9.3'
        distribution: 'minimal'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev

    # Install picosat as a mock custom solver, to test the custom-solver workflow.
    - name: Install picosat
      if: matrix.custom-run
      run: sudo apt-get install -y -qq picosat

    - name: Install cvc5
      if: matrix.name == 'smt'
      run: |
        wget -q https://github.com/cvc5/cvc5/releases/download/cvc5-1.2.0/cvc5-Linux-x86_64-static.zip
        unzip -q cvc5-Linux-x86_64-static.zip
        echo "$PWD/cvc5-Linux-x86_64-static/bin" >> $GITHUB_PATH

    - name: Cache Racket packages
      uses: actions/cache@v4
      with:
        path: ~/.local/share/racket
        key: racket-pkgs-minimal-${{ hashFiles('forge/info.rkt') }}
        restore-keys: racket-pkgs-minimal-

    # Recompile only files whose source or dependencies changed.
    - name: Cache Forge compiled files
      uses: actions/cache@v4
      with:
        path: |
          forge/**/compiled
          !forge/tests/**
        key: forge-compiled-${{ runner.os }}-racket9.3-${{ hashFiles('forge/**/*.rkt', '!forge/tests/**') }}
        restore-keys: forge-compiled-${{ runner.os }}-racket9.3-

    - name: Install Forge
      run: |
        raco pkg update --auto --no-docs --batch ./forge 2>/dev/null || raco pkg install --auto --no-docs ./forge

    # Don't re-solve unnecessarily. If the Pardinus problem, JAR version, and JVM version
    # are the same, look in the cache before invoking the solver. 
    - name: Cache solver verdicts
      if: ${{ !matrix.custom-run }}
      uses: actions/cache@v4
      with:
        path: ~/.forge-solve-cache
        key: forge-solve-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('forge/pardinus-cli/jar/**') }}-${{ github.sha }}
        restore-keys: forge-solve-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('forge/pardinus-cli/jar/**') }}-

    # Primary tests (excluding custom solver tests)
    - name: Run tests
      if: ${{ !matrix.custom-run }}
      run: |
        export FORGE_SOLVE_CACHE="$HOME/.forge-solve-cache"
        # A `git push` to the `main` will verify, rather than trust, the cache. 
        if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
          export FORGE_SOLVE_CACHE_VERIFY=1
        fi
        cd forge/
        chmod +x run-tests.sh
        for dir in ${{ matrix.test-dir }}; do
          ./run-tests.sh "$dir"
        done

    # Now test custom solvers 
    - name: Run custom solver tests
      if: ${{ matrix.custom-run }}
      run: |
        cd forge/${{ matrix.test-dir }}
        chmod +x run.sh subdir/run.sh run_picosat.sh
        exitCode=0
        for f in *.frg; do
          echo "Running $f..."
          if ! racket "$f" -O run_sterling \'off; then
            echo "FAILED: $f"
            exitCode=1
          fi
        done
        echo "Running custom_solver_next.rkt..."
        if ! raco test custom_solver_next.rkt; then
          echo "FAILED: custom_solver_next.rkt"
          exitCode=1
        fi
        exit $exitCode

    # Re-test custom solvers within `forge/`. This is meant to check for a regression
    # where relative paths start mattering again for custom solvers.
    - name: Run custom solver tests (launched from forge)
      if: ${{ !cancelled() && matrix.custom-run }}
      run: |
        cd forge
        chmod +x ${{ matrix.test-dir }}/run.sh ${{ matrix.test-dir }}/subdir/run.sh
        exitCode=0
        for f in ${{ matrix.test-dir }}/*.frg; do
          echo "Running $f from forge/..."
          if ! racket "$f" -O run_sterling \'off; then
            echo "FAILED: $f"
            exitCode=1
          fi
        done
        exit $exitCode

  # Test custom solvers on Windows.
  test-custom-solver-win:
    runs-on: windows-latest
    name: test-custom-solver-win
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Racket
      uses: Bogdanp/setup-racket@v1.14
      with:
        version: '9.3'
        distribution: 'minimal'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Racket packages
      uses: actions/cache@v4
      with:
        path: ~/AppData/Roaming/Racket
        key: racket-pkgs-minimal-win-${{ hashFiles('forge/info.rkt') }}
        restore-keys: racket-pkgs-minimal-win-

    - name: Install Forge
      run: |
        raco pkg update --auto --no-docs --batch ./forge 2>$null; if ($LASTEXITCODE -ne 0) { raco pkg install --auto --no-docs ./forge }

    - name: Run custom solver tests
      shell: cmd
      run: |
        cd forge\tests\forge\custom-solver\win
        set exitCode=0
        for %%f in (*.frg) do (
          echo Running %%f...
          racket "%%f" -O run_sterling 'off
          if errorlevel 1 (
            echo FAILED: %%f
            set exitCode=1
          )
        )
        exit /b %exitCode%

    - name: Run custom solver tests (path with spaces)
      shell: cmd
      run: |
        mkdir "forge\tests\forge\custom-solver\win space test"
        xcopy /s /e /i "forge\tests\forge\custom-solver\win" "forge\tests\forge\custom-solver\win space test"
        cd "forge\tests\forge\custom-solver\win space test"
        set exitCode=0
        for %%f in (*.frg) do (
          echo Running %%f [space path]...
          racket "%%f" -O run_sterling 'off
          if errorlevel 1 (
            echo FAILED: %%f
            set exitCode=1
          )
        )
        exit /b %exitCode%

    # Re-test custom solvers within `forge/`. This is meant to check for a regression
    # where relative paths start mattering again for custom solvers.
    - name: Run custom solver tests (launched from forge)
      shell: cmd
      run: |
        cd forge
        set exitCode=0
        for %%f in (tests\forge\custom-solver\win\*.frg) do (
          echo Running %%f from forge...
          racket "%%f" -O run_sterling 'off
          if errorlevel 1 (
            echo FAILED: %%f
            set exitCode=1
          )
        )
        exit /b %exitCode%

  # Test custom solvers on macOS.
  test-custom-solver-mac:
    runs-on: macos-latest
    name: test-custom-solver-mac
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Racket
      uses: Bogdanp/setup-racket@v1.14
      with:
        version: '9.3'
        distribution: 'minimal'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Racket packages
      uses: actions/cache@v4
      with:
        path: ~/Library/Racket
        key: racket-pkgs-minimal-mac-${{ hashFiles('forge/info.rkt') }}
        restore-keys: racket-pkgs-minimal-mac-

    # Recompile only files whose source or dependencies changed.
    - name: Cache Forge compiled files
      uses: actions/cache@v4
      with:
        path: |
          forge/**/compiled
          !forge/tests/**
        key: forge-compiled-${{ runner.os }}-racket9.3-${{ hashFiles('forge/**/*.rkt', '!forge/tests/**') }}
        restore-keys: forge-compiled-${{ runner.os }}-racket9.3-

    - name: Install Forge
      run: |
        raco pkg update --auto --no-docs --batch ./forge 2>/dev/null || raco pkg install --auto --no-docs ./forge

    - name: Run custom solver tests
      run: |
        cd forge/tests/forge/custom-solver
        chmod +x run.sh subdir/run.sh
        exitCode=0
        for f in *.frg; do
          echo "Running $f..."
          if ! racket "$f" -O run_sterling \'off; then
            echo "FAILED: $f"
            exitCode=1
          fi
        done
        exit $exitCode

    - name: Run custom solver tests (path with spaces)
      run: |
        cp -R forge/tests/forge/custom-solver "forge/tests/forge/mac space test"
        cd "forge/tests/forge/mac space test"
        chmod +x run.sh subdir/run.sh
        exitCode=0
        for f in *.frg; do
          echo "Running $f [space path]..."
          if ! racket "$f" -O run_sterling \'off; then
            echo "FAILED: $f"
            exitCode=1
          fi
        done
        exit $exitCode

    # Re-test custom solvers within `forge/`. This is meant to check for a regression
    # where relative paths start mattering again for custom solvers.
    - name: Run custom solver tests (launched from forge)
      run: |
        cd forge
        chmod +x tests/forge/custom-solver/run.sh tests/forge/custom-solver/subdir/run.sh
        exitCode=0
        for f in tests/forge/custom-solver/*.frg; do
          echo "Running $f from forge/..."
          if ! racket "$f" -O run_sterling \'off; then
            echo "FAILED: $f"
            exitCode=1
          fi
        done
        exit $exitCode
